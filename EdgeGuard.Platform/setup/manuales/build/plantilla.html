<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>{{TITULO}}</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Hoja de estilo de impresión de los manuales EdgeGuard.

   Todo con tipografías del sistema: el PDF se genera en el equipo de quien
   arma el paquete, sin red, y una fuente que no cargue cambia la paginación
   sin avisar.
   ─────────────────────────────────────────────────────────────────────────── */

:root {
  --tinta:        #1a2230;
  --tinta-suave:  #4d5766;
  --regla:        #d3d9e0;
  --regla-fuerte: #9aa5b4;
  --acento:       #0f5a7a;
  --fondo-codigo: #f4f6f8;
  --fondo-nota:   #f7f9fa;
  --serif:  Georgia, "Times New Roman", serif;
  --sans:   "Segoe UI", Tahoma, Arial, sans-serif;
  --mono:   Consolas, "Courier New", monospace;
}

@page {
  size: Letter;
  /* Los mismos valores que recibe el motor de impresion por el protocolo. Si
     difieren, gana esta regla y el pie de pagina queda desalineado del texto. */
  margin: 1in 1in 0.9in;
}

html { font-size: 11pt; }

body {
  margin: 0;
  color: var(--tinta);
  background: #fff;
  font-family: var(--serif);
  line-height: 1.5;
  orphans: 3;
  widows: 3;
}

/* ── Portada ─────────────────────────────────────────────────────────────── */

.portada {
  page-break-after: always;
  min-height: 8.2in;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.portada .marca {
  font-family: var(--sans);
  font-size: 9.5pt;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--acento);
  margin-bottom: 2.2em;
}

.portada h1 {
  font-family: var(--sans);
  font-size: 30pt;
  line-height: 1.15;
  font-weight: 600;
  margin: 0 0 .35em 0;
  text-wrap: balance;
  page-break-before: auto;
  border: 0;
  padding: 0;
}

.portada .subtitulo {
  font-size: 13pt;
  color: var(--tinta-suave);
  margin: 0 0 2.5em 0;
  max-width: 34em;
}

.portada .filete { border-top: 2px solid var(--acento); width: 3.2in; margin-bottom: 2.2em; }

.portada .datos {
  font-family: var(--sans);
  font-size: 10pt;
  color: var(--tinta-suave);
}
.portada .datos dl { display: grid; grid-template-columns: 7em 1fr; gap: .35em 1em; margin: 0; }
.portada .datos dt { color: var(--regla-fuerte); }
.portada .datos dd { margin: 0; color: var(--tinta); }

.portada .nota {
  margin-top: 2.6em;
  padding: .9em 1.1em;
  background: var(--fondo-nota);
  border-left: 3px solid var(--acento);
  font-size: 10pt;
  color: var(--tinta-suave);
  max-width: 32em;
}

/* ── Índice ──────────────────────────────────────────────────────────────── */

.indice { page-break-after: always; }
.indice h2 {
  page-break-before: auto;
  margin-top: 0;
}
.indice ol { list-style: none; padding: 0; margin: 0; counter-reset: none; }
.indice li { margin: 0; }
.indice a {
  display: block;
  font-family: var(--sans);
  color: var(--tinta);
  text-decoration: none;
}

.indice li.principal { border-bottom: 1px solid var(--regla); margin-top: .9em; }
.indice li.principal:first-child { margin-top: 0; }
.indice li.principal a { padding: .35em 0; font-size: 11pt; font-weight: 600; }

.indice li.secundario a {
  padding: .28em 0 .28em 1.4em;
  font-size: 9.5pt;
  color: var(--tinta-suave);
}

/* ── Cuerpo ──────────────────────────────────────────────────────────────── */

h2, h3, h4 { font-family: var(--sans); font-weight: 600; page-break-after: avoid; text-wrap: balance; }

h2 {
  page-break-before: always;
  font-size: 18pt;
  margin: 0 0 .8em 0;
  padding-bottom: .3em;
  border-bottom: 2px solid var(--acento);
  color: var(--acento);
}

h3 { font-size: 13pt; margin: 1.8em 0 .5em 0; }
h4 { font-size: 11pt; margin: 1.4em 0 .4em 0; color: var(--tinta-suave); }

p { margin: 0 0 .8em 0; }

a { color: var(--acento); text-decoration: none; }

hr { border: 0; border-top: 1px solid var(--regla); margin: 1.6em 0; }

/* ── Listas ──────────────────────────────────────────────────────────────── */

ul, ol { margin: 0 0 1em 0; padding-left: 1.4em; }
li { margin-bottom: .35em; }

li.casilla { list-style: none; margin-left: -1.4em; padding-left: 1.7em; position: relative; }
li.casilla .caja { position: absolute; left: 0; font-size: 12pt; line-height: 1.2; color: var(--regla-fuerte); }

/* ── Código ──────────────────────────────────────────────────────────────── */

code {
  font-family: var(--mono);
  font-size: .88em;
  background: var(--fondo-codigo);
  padding: .08em .3em;
  border-radius: 2px;
}

pre {
  font-family: var(--mono);
  font-size: 9pt;
  line-height: 1.45;
  background: var(--fondo-codigo);
  border: 1px solid var(--regla);
  border-left: 3px solid var(--regla-fuerte);
  padding: .8em 1em;
  margin: 0 0 1em 0;
  /* Se envuelve a propósito: en papel, una línea cortada es una línea perdida. */
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  page-break-inside: avoid;
}
pre code { background: none; padding: 0; font-size: inherit; }

/* ── Citas: advertencias y notas ─────────────────────────────────────────── */

blockquote {
  margin: 0 0 1em 0;
  padding: .75em 1em;
  background: var(--fondo-nota);
  border-left: 3px solid var(--acento);
  page-break-inside: avoid;
}
blockquote p:last-child { margin-bottom: 0; }

/* ── Tablas ──────────────────────────────────────────────────────────────── */

table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 1.2em 0;
  font-size: 9.5pt;
  font-variant-numeric: tabular-nums;
}
thead { display: table-header-group; }
th, td {
  border: 1px solid var(--regla);
  padding: .45em .6em;
  text-align: left;
  vertical-align: top;
}
th {
  font-family: var(--sans);
  font-weight: 600;
  background: var(--fondo-codigo);
  border-bottom: 1px solid var(--regla-fuerte);
}
tr { page-break-inside: avoid; }
td code, th code { background: none; padding: 0; }

/* ── Marco de página ─────────────────────────────────────────────────────── */

.hoja { padding: 0; }
</style>
</head>
<body>

<section class="portada">
  <div class="marca">EdgeGuard Platform</div>
  <h1>{{TITULO}}</h1>
  <p class="subtitulo">{{SUBTITULO}}</p>
  <div class="filete"></div>
  <div class="datos">
    <dl>
      <dt>Versión</dt><dd>{{VERSION}}</dd>
      <dt>Fecha</dt><dd>{{FECHA}}</dd>
      <dt>Dirigido a</dt><dd>Personal de operación y soporte del cliente</dd>
    </dl>
  </div>
  <div class="nota">{{NOTA_PORTADA}}</div>
</section>

<nav class="indice">
  <h2>Contenido</h2>
  <ol>
{{INDICE}}
  </ol>
</nav>

<main class="hoja">
{{CUERPO}}
</main>

</body>
</html>
