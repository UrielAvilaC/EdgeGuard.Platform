<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>{{TITULO}}</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Tarjeta desprendible: dos hojas para imprimir y pegar junto al servidor.

   Sin portada y sin índice a propósito. Un documento de dos páginas que se
   consulta de pie no necesita ninguna de las dos, y ambas le costarían la
   mitad del espacio útil.
   ─────────────────────────────────────────────────────────────────────────── */

:root {
  --tinta:        #1a2230;
  --tinta-suave:  #4d5766;
  --regla:        #d3d9e0;
  --regla-fuerte: #9aa5b4;
  --acento:       #0f5a7a;
  --fondo-codigo: #f4f6f8;
  --serif:  Georgia, "Times New Roman", serif;
  --sans:   "Segoe UI", Tahoma, Arial, sans-serif;
  --mono:   Consolas, "Courier New", monospace;
}

@page {
  size: Letter;
  /* Igual que el margen que se pasa al motor de impresion. */
  margin: 0.6in;
}

html { font-size: 9pt; }

body {
  margin: 0;
  color: var(--tinta);
  background: #fff;
  font-family: var(--serif);
  line-height: 1.35;
}

.cabecera {
  border-bottom: 2px solid var(--acento);
  padding-bottom: .5em;
  margin-bottom: 1em;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.cabecera .nombre {
  font-family: var(--sans);
  font-size: 13pt;
  font-weight: 600;
  color: var(--acento);
}
.cabecera .datos {
  font-family: var(--sans);
  font-size: 7.5pt;
  color: var(--regla-fuerte);
  letter-spacing: .04em;
  text-transform: uppercase;
}

h2 {
  font-family: var(--sans);
  font-size: 11.5pt;
  font-weight: 600;
  color: var(--acento);
  margin: 1.4em 0 .5em 0;
  padding-bottom: .2em;
  border-bottom: 1px solid var(--regla);
  page-break-after: avoid;
}
h2:first-of-type { margin-top: 0; }

p { margin: 0 0 .6em 0; }
ol, ul { margin: 0 0 .7em 0; padding-left: 1.3em; }
li { margin-bottom: .25em; }

code {
  font-family: var(--mono);
  font-size: .9em;
  background: var(--fondo-codigo);
  padding: .05em .25em;
}

pre {
  font-family: var(--mono);
  font-size: 7.6pt;
  line-height: 1.35;
  background: var(--fondo-codigo);
  border-left: 2px solid var(--regla-fuerte);
  padding: .5em .7em;
  margin: 0 0 .8em 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  page-break-inside: avoid;
}
pre code { background: none; padding: 0; font-size: inherit; }

table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 .9em 0;
  font-size: 8pt;
}
th, td { border: 1px solid var(--regla); padding: .3em .45em; text-align: left; vertical-align: top; }
th { font-family: var(--sans); font-weight: 600; background: var(--fondo-codigo); }
tr { page-break-inside: avoid; }
td code { background: none; padding: 0; }

blockquote {
  margin: 0 0 .8em 0;
  padding: .5em .7em;
  background: var(--fondo-codigo);
  border-left: 2px solid var(--acento);
}
blockquote p:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<div class="cabecera">
  <span class="nombre">{{TITULO}}</span>
  <span class="datos">EdgeGuard Hub &middot; v{{VERSION}} &middot; {{FECHA}}</span>
</div>

{{CUERPO}}

</body>
</html>
