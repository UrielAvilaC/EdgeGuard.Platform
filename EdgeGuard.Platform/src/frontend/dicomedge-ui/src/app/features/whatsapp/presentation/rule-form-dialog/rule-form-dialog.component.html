<div class="p-6 w-[480px] max-w-full">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{ isEdit ? 'Editar Regla' : 'Crear Regla Auto-Send' }}
        </h2>
        <ui-icon-button [icon]="faXmark" tooltip="Cerrar" ariaLabel="Cerrar diálogo" (clicked)="onCancel()" />
      </div>

      <form #ruleForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
        @if (!isEdit) {
          <ui-dropdown
            label="Estado del estudio (trigger)"
            [options]="studyStatusOptions"
            [(ngModel)]="createForm.studyStatus"
            name="studyStatus"
            required
          />
        }

        <ui-dropdown
          label="Template"
          [options]="templateOptions"
          [(ngModel)]="templateId"
          name="templateId"
          [required]="!isEdit"
        />

        <ui-textarea
          label="Descripción"
          placeholder="Descripción de la regla..."
          [(ngModel)]="description"
          name="description"
        />

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <ui-button variant="secondary" type="button" (clicked)="onCancel()">
            Cancelar
          </ui-button>
          <ui-button type="submit">
            {{ isEdit ? 'Guardar' : 'Crear' }}
          </ui-button>
        </div>
      </form>
    </div>
