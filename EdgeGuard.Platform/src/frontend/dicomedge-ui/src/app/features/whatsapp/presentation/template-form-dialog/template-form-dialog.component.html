<div class="p-6 w-[540px] max-w-full">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{ isEdit ? 'Editar Template' : 'Crear Template' }}
        </h2>
        <ui-icon-button [icon]="faXmark" tooltip="Cerrar" ariaLabel="Cerrar diálogo" (clicked)="onCancel()" />
      </div>

      <form #templateForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <ui-input-text
          label="Nombre"
          placeholder="Nombre del template"
          [(ngModel)]="form.name"
          name="name"
          required
        />

        <ui-input-text
          label="Content SID"
          placeholder="HX1234567890..."
          [(ngModel)]="form.contentSid"
          name="contentSid"
          required
        />

        <ui-textarea
          label="Descripción"
          placeholder="Descripción del template..."
          [(ngModel)]="form.description"
          name="description"
        />

        <ui-dropdown
          label="Tags (variables)"
          [options]="tagOptions"
          [(ngModel)]="form.tags"
          name="tags"
          [multiple]="true"
          placeholder="Seleccionar tags..."
        />

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <ui-button variant="secondary" type="button" (clicked)="onCancel()">
            Cancelar
          </ui-button>
          <ui-button type="submit">
            {{ isEdit ? 'Guardar' : 'Crear' }}
          </ui-button>
        </div>
      </form>
    </div>
