<div class="p-6 w-[540px] max-w-full">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{ isEdit ? 'Editar Servidor PACS' : 'Crear Servidor PACS' }}
        </h2>
        <ui-icon-button [icon]="faXmark" tooltip="Cerrar" ariaLabel="Cerrar diálogo" (clicked)="onCancel()" />
      </div>

      <form #pacsForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <ui-input-text
          label="Nombre"
          placeholder="Nombre del servidor"
          [(ngModel)]="form.name"
          name="name"
          required
        />

        @if (!isEdit) {
          <ui-input-text
            label="AE Title"
            placeholder="AE Title DICOM"
            [(ngModel)]="createAeTitle"
            name="aeTitle"
            required
          />
        }

        <div class="grid grid-cols-2 gap-4">
          <ui-input-text
            label="Host"
            placeholder="192.168.1.50"
            [(ngModel)]="form.hostName"
            name="hostName"
            required
          />
          <ui-input-text
            label="Puerto"
            type="number"
            placeholder="104"
            [(ngModel)]="form.port"
            name="port"
            required
          />
        </div>

        <ui-input-text
          label="Descripción"
          placeholder="Descripción del servidor"
          [(ngModel)]="form.description"
          name="description"
        />

        <div class="grid grid-cols-2 gap-4">
          <ui-input-text
            label="Asociaciones concurrentes"
            type="number"
            [(ngModel)]="form.maxConcurrentAssociations"
            name="maxConcurrentAssociations"
          />
          <ui-input-text
            label="Timeout (seg)"
            type="number"
            [(ngModel)]="form.timeoutSeconds"
            name="timeoutSeconds"
          />
        </div>

        @if (!isEdit) {
          <ui-slide-toggle
            label="Servidor global (asignado a todos los nodos)"
            [(ngModel)]="createIsGlobal"
            name="isGlobal"
          />
        }

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <ui-button variant="secondary" type="button" (clicked)="onCancel()">
            Cancelar
          </ui-button>
          <ui-button type="submit">
            {{ isEdit ? 'Guardar' : 'Crear' }}
          </ui-button>
        </div>
      </form>
    </div>
