<div class="p-6 w-[540px] max-w-full">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{ isEdit ? 'Editar Nodo' : 'Crear Nodo' }}
        </h2>
        <ui-icon-button [icon]="faXmark" tooltip="Cerrar" ariaLabel="Cerrar diálogo" (clicked)="onCancel()" />
      </div>

      <form #nodeForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
        @if (!isEdit) {
          <ui-input-text
            label="Nombre"
            placeholder="Nombre del nodo"
            [(ngModel)]="createForm.name"
            name="name"
            required
          />
          <ui-input-text
            label="AE Title"
            placeholder="AE Title DICOM"
            [(ngModel)]="createForm.aeTitle"
            name="aeTitle"
            required
          />
          <div class="grid grid-cols-2 gap-4">
            <ui-input-text
              label="Dirección IP"
              placeholder="192.168.1.100"
              [(ngModel)]="createForm.ipAddress"
              name="ipAddress"
              required
            />
            <ui-input-text
              label="Puerto"
              type="number"
              placeholder="104"
              [(ngModel)]="createForm.port"
              name="port"
              required
            />
          </div>
          <ui-input-text
            label="API Endpoint"
            placeholder="https://node.example.com/api"
            [(ngModel)]="createForm.apiEndpoint"
            name="apiEndpoint"
          />
        }

        <ui-input-text
          label="Ubicación"
          placeholder="Sala 3, Piso 2"
          [(ngModel)]="editForm.location"
          name="location"
        />
        <ui-input-text
          label="Facility"
          placeholder="Hospital Central"
          [(ngModel)]="editForm.facilityName"
          name="facilityName"
        />

        @if (isEdit) {
          <ui-input-text
            label="Zona horaria"
            placeholder="America/Mexico_City"
            [(ngModel)]="editForm.timeZone"
            name="timeZone"
          />
          <div class="grid grid-cols-2 gap-4">
            <ui-input-text
              label="Max Storage (MB)"
              type="number"
              [(ngModel)]="editForm.maxStorageMb"
              name="maxStorageMb"
            />
            <ui-input-text
              label="Health Check (seg)"
              type="number"
              [(ngModel)]="editForm.healthCheckIntervalSeconds"
              name="healthCheck"
            />
          </div>
        } @else {
          <ui-input-text
            label="Health Check Interval (seg)"
            type="number"
            placeholder="60"
            [(ngModel)]="createForm.healthCheckIntervalSeconds"
            name="healthCheck"
          />
        }

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <ui-button variant="secondary" type="button" (clicked)="onCancel()">
            Cancelar
          </ui-button>
          <ui-button type="submit">
            {{ isEdit ? 'Guardar' : 'Crear' }}
          </ui-button>
        </div>
      </form>
    </div>
