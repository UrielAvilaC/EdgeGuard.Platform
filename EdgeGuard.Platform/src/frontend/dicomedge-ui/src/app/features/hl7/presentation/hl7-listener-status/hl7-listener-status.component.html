@if (status(); as s) {
      <div class="p-5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-semibold text-gray-900 dark:text-white">
            <fa-icon [icon]="faNetworkWired" class="mr-2" /> TCP Listener
          </h3>
          <ui-chip [color]="s.isRunning ? 'success' : 'danger'">
            <fa-icon [icon]="faCircle" class="mr-1 text-[8px]" />
            {{ s.isRunning ? 'Activo' : 'Detenido' }}
          </ui-chip>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="p-3 rounded-lg bg-gray-50 dark:bg-gray-800/50">
            <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">
              <fa-icon [icon]="faPlug" class="mr-1" /> Puerto
            </div>
            <div class="text-xl font-bold text-gray-900 dark:text-white">
              {{ s.port }}
            </div>
          </div>
          <div class="p-3 rounded-lg bg-gray-50 dark:bg-gray-800/50">
            <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">
              Conexiones activas
            </div>
            <div class="text-xl font-bold" [class]="s.activeConnections > 0 ? 'text-azure-600 dark:text-azure-400' : 'text-gray-900 dark:text-white'">
              {{ s.activeConnections }}
            </div>
          </div>
        </div>
      </div>
    } @else {
      <div class="p-5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
        <p class="text-gray-400 text-sm">Cargando estado del listener...</p>
      </div>
    }
