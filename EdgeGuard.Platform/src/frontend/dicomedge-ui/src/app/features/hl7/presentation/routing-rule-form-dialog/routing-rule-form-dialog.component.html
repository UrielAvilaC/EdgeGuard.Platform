<div class="p-6 w-[540px] max-w-full">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{ isEdit ? 'Editar Regla' : 'Crear Regla de Enrutamiento' }}
        </h2>
        <ui-icon-button [icon]="faXmark" tooltip="Cerrar" ariaLabel="Cerrar diálogo" (clicked)="onCancel()" />
      </div>

      <form #ruleForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <ui-input-text
          label="Nombre"
          placeholder="Nombre de la regla"
          [(ngModel)]="form.name"
          name="name"
          required
        />

        <ui-dropdown
          label="Nodo destino"
          [options]="nodeOptions"
          [(ngModel)]="form.targetNodeId"
          name="targetNodeId"
          required
        />

        <ui-input-text
          label="Prioridad"
          type="number"
          placeholder="100"
          [(ngModel)]="form.priority"
          name="priority"
          required
        />

        <div class="pt-2">
          <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">Criterios de coincidencia</h3>
          <div class="space-y-3">
            <div class="grid grid-cols-2 gap-4">
              <ui-input-text
                label="Tipo de mensaje"
                placeholder="ADT, ORM, ORU..."
                [(ngModel)]="form.matchMessageType"
                name="matchMessageType"
              />
              <ui-input-text
                label="Trigger Event"
                placeholder="A01, A08..."
                [(ngModel)]="form.matchTriggerEvent"
                name="matchTriggerEvent"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <ui-input-text
                label="Sending Facility"
                placeholder="Hospital..."
                [(ngModel)]="form.matchSendingFacility"
                name="matchSendingFacility"
              />
              <ui-input-text
                label="Sending Application"
                placeholder="HIS, RIS..."
                [(ngModel)]="form.matchSendingApplication"
                name="matchSendingApplication"
              />
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <ui-button variant="secondary" type="button" (clicked)="onCancel()">
            Cancelar
          </ui-button>
          <ui-button type="submit">
            {{ isEdit ? 'Guardar' : 'Crear' }}
          </ui-button>
        </div>
      </form>
    </div>
