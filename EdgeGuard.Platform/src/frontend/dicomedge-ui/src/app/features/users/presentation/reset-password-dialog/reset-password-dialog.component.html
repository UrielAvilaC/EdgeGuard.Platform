<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <ui-dialog width="440px">

    <div uiDialogHeader class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-amber-100 dark:bg-amber-900/30">
          <fa-icon [icon]="faKey" class="text-amber-600 dark:text-amber-400" />
        </div>
        <div>
          <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Restablecer contraseña</h2>
          <p class="text-sm text-gray-500 dark:text-gray-400">Asigna una nueva contraseña al usuario.</p>
        </div>
      </div>
      <ui-icon-button [icon]="faTimes" tooltip="Cerrar" ariaLabel="Cerrar diálogo" (clicked)="dialogRef.close(null)" />
    </div>

    <div uiDialogBody class="space-y-5">
      <div class="space-y-4">
        <ui-input-text label="Nueva contraseña" placeholder="Mínimo 8 caracteres" hint="Debe tener al menos 8 caracteres." formControlName="newPassword" type="password" [required]="true" />
        <ui-input-text label="Confirmar contraseña" placeholder="Repite la contraseña" formControlName="confirmPassword" type="password" [required]="true" />
      </div>

      @if (form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched) {
        <div class="flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 dark:border-red-800 dark:bg-red-900/20 px-3 py-2">
          <span class="text-xs text-red-600 dark:text-red-400">Las contraseñas no coinciden.</span>
        </div>
      }
    </div>

    <div uiDialogFooter class="flex items-center gap-3">
      <ui-button variant="secondary" (clicked)="dialogRef.close(null)">Cancelar</ui-button>
      <ui-button type="submit" [disabled]="form.invalid">Restablecer contraseña</ui-button>
    </div>

  </ui-dialog>
</form>
