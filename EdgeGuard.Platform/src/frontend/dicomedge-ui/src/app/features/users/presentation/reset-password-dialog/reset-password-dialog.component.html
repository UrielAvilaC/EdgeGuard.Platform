<div class="p-6 max-w-sm">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Restablecer contraseña</h2>
        <button type="button" class="text-gray-400 hover:text-gray-600" (click)="dialogRef.close(null)" aria-label="Cerrar">
          <fa-icon [icon]="faTimes" />
        </button>
      </div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <ui-input-text label="Nueva contraseña" formControlName="newPassword" type="password" [required]="true" />
        <ui-input-text label="Confirmar contraseña" formControlName="confirmPassword" type="password" [required]="true" />
        @if (form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched) {
          <p class="text-xs text-red-600">Las contraseñas no coinciden.</p>
        }
        <div class="flex justify-end gap-3 pt-4">
          <ui-button variant="secondary" (clicked)="dialogRef.close(null)">Cancelar</ui-button>
          <ui-button type="submit" [disabled]="form.invalid">Restablecer</ui-button>
        </div>
      </form>
    </div>
