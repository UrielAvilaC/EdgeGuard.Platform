<div class="space-y-6">
      <!-- Roles -->
      <div>
        <h3 class="text-sm font-semibold text-gray-900 dark:text-white mb-3">Roles</h3>
        <div class="flex flex-wrap gap-2">
          @for (role of allRoles; track role.value) {
            @if (hasRole(role.value)) {
              <button
                type="button"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-azure-100 text-azure-700 dark:bg-azure-900/30 dark:text-azure-400 hover:bg-red-100 hover:text-red-700 dark:hover:bg-red-900/30 dark:hover:text-red-400 transition-colors"
                (click)="removeRoleClicked.emit(role.value)"
                [attr.aria-label]="'Remover rol ' + role.label"
              >
                <fa-icon [icon]="faTimes" class="text-[10px]" />
                {{ role.label }}
              </button>
            } @else {
              <button
                type="button"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border border-dashed border-gray-300 text-gray-500 hover:border-azure-400 hover:text-azure-600 dark:border-gray-600 dark:text-gray-400 dark:hover:border-azure-400 dark:hover:text-azure-400 transition-colors"
                (click)="addRoleClicked.emit(role.value)"
                [attr.aria-label]="'Asignar rol ' + role.label"
              >
                <fa-icon [icon]="faPlus" class="text-[10px]" />
                {{ role.label }}
              </button>
            }
          }
        </div>
      </div>

      <!-- Direct Permissions -->
      <div>
        <h3 class="text-sm font-semibold text-gray-900 dark:text-white mb-3">Permisos directos</h3>
        <div class="space-y-4">
          @for (group of permissionGroups; track group.label) {
            <div>
              <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">{{ group.label }}</p>
              <div class="flex flex-wrap gap-1.5">
                @for (perm of group.permissions; track perm.value) {
                  <button
                    type="button"
                    class="inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-medium transition-colors"
                    [class]="hasPermission(perm.value)
                      ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 hover:bg-red-100 hover:text-red-700 dark:hover:bg-red-900/30 dark:hover:text-red-400'
                      : 'bg-gray-100 text-gray-500 dark:bg-gray-800 dark:text-gray-400 hover:bg-emerald-100 hover:text-emerald-700 dark:hover:bg-emerald-900/30 dark:hover:text-emerald-400'"
                    (click)="togglePermission(perm.value)"
                    [attr.aria-label]="(hasPermission(perm.value) ? 'Revocar ' : 'Otorgar ') + perm.label"
                    [attr.aria-pressed]="hasPermission(perm.value)"
                  >
                    @if (hasPermission(perm.value)) {
                      <fa-icon [icon]="faCheck" class="text-[10px]" />
                    }
                    {{ perm.label }}
                  </button>
                }
              </div>
            </div>
          }
        </div>
      </div>
    </div>
