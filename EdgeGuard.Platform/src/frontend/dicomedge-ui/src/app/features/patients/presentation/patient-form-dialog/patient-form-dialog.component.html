<form #patientForm="ngForm" (ngSubmit)="onSubmit()">
  <ui-dialog width="500px">

    <div uiDialogHeader class="flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Editar Paciente</h2>
      <ui-icon-button [icon]="faXmark" tooltip="Cerrar" ariaLabel="Cerrar diálogo" (clicked)="onCancel()" />
    </div>

    <div uiDialogBody class="space-y-4">
      <ui-input-text
        label="Nombre"
        placeholder="Nombre del paciente"
        [(ngModel)]="form.patientName"
        name="patientName"
        required
      />

      <ui-datepicker
        label="Fecha de Nacimiento"
        [(ngModel)]="form.birthDate"
        name="birthDate"
      />

      <ui-dropdown
        label="Sexo"
        [options]="sexOptions"
        [showEmpty]="true"
        emptyLabel="No especificado"
        [(ngModel)]="form.sex"
        name="sex"
      />

      <ui-input-text
        label="Teléfono"
        placeholder="+52 55 1234 5678"
        [(ngModel)]="form.phoneNumber"
        name="phoneNumber"
      />

      <ui-input-text
        label="Email"
        placeholder="paciente@ejemplo.com"
        type="email"
        [(ngModel)]="form.email"
        name="email"
      />
    </div>

    <div uiDialogFooter class="flex items-center gap-3">
      <ui-button variant="secondary" type="button" (clicked)="onCancel()">
        Cancelar
      </ui-button>
      <ui-button type="submit">
        Guardar
      </ui-button>
    </div>

  </ui-dialog>
</form>
