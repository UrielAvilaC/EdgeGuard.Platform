<div class="table-card">
      @if (loading()) {
        <mat-progress-bar mode="indeterminate" class="table-progress" />
      }

      <div class="table-scroll">
        <table
          mat-table
          [dataSource]="data()"
          matSort
          [matSortActive]="sort()?.sortBy ?? ''"
          [matSortDirection]="sortDirection()"
          (matSortChange)="onSortChange($event)"
          class="w-full"
        >
          @if (selectable()) {
            <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef class="w-12">
                <mat-checkbox
                  [checked]="isAllSelected()"
                  [indeterminate]="selection.hasValue() && !isAllSelected()"
                  (change)="toggleAllRows()"
                  aria-label="Select all rows"
                />
              </th>
              <td mat-cell *matCellDef="let row">
                <mat-checkbox
                  [checked]="selection.isSelected(row)"
                  (change)="toggleRow(row)"
                  (click)="$event.stopPropagation()"
                  aria-label="Select row"
                />
              </td>
            </ng-container>
          }

          @for (col of columns(); track col.key) {
            <ng-container [matColumnDef]="col.key">
              <th
                mat-header-cell
                *matHeaderCellDef
                [mat-sort-header]="col.sortable ? col.key : ''"
                [disabled]="!col.sortable"
                [style.width]="col.width ?? 'auto'"
                [style.text-align]="col.align ?? 'left'"
              >
                {{ col.header }}
              </th>
              <td
                mat-cell
                *matCellDef="let row"
                [style.text-align]="col.align ?? 'left'"
              >
                @if (getCellTemplate(col.key); as tmpl) {
                  <ng-container
                    [ngTemplateOutlet]="tmpl"
                    [ngTemplateOutletContext]="{ $implicit: row, value: getCellValue(row, col) }"
                  />
                } @else {
                  {{ getCellValue(row, col) }}
                }
              </td>
            </ng-container>
          }

          <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns()"
            (click)="rowClick.emit(row)"
            class="cursor-pointer"
          ></tr>
        </table>
      </div>

      @if (!loading() && data().length === 0) {
        <ui-empty-state [title]="emptyMessage()" />
      }

      @if (pagination()) {
        <mat-paginator
          [length]="pagination()!.total"
          [pageIndex]="pagination()!.page - 1"
          [pageSize]="pagination()!.pageSize"
          [pageSizeOptions]="pageSizeOptions()"
          (page)="onPageChange($event)"
          showFirstLastButtons
          aria-label="Paginación"
        />
      }
    </div>
