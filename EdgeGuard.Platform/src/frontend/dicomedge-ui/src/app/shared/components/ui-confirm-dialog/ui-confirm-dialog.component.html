<!-- No usa <ui-dialog>: es una tarjeta de alerta centrada, sin barra de header.
     Aplica el mismo principio: el mensaje es lo único que scrollea y las
     acciones nunca quedan fuera de pantalla. -->
<div class="confirm-dialog flex flex-col max-h-[85dvh]">
      @if (data.icon) {
        <div class="dialog-icon" [class.dialog-icon-warn]="data.confirmColor === 'warn'">
          <fa-icon [icon]="data.icon" />
        </div>
      }
      <h2 class="dialog-title">{{ data.title }}</h2>
      <p class="dialog-message flex-1 min-h-0 overflow-y-auto">{{ data.message }}</p>
      <div class="dialog-actions shrink-0">
        <button
          mat-stroked-button
          (click)="dialogRef.close(false)"
          class="dialog-btn-cancel"
        >
          {{ data.cancelText || 'Cancelar' }}
        </button>
        <button
          mat-flat-button
          [color]="data.confirmColor || 'primary'"
          (click)="dialogRef.close(true)"
          class="dialog-btn-confirm"
        >
          {{ data.confirmText || 'Confirmar' }}
        </button>
      </div>
    </div>
